name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip && python -m pip install -e . -r requirements-dev.txt
      - run: PYTHONPATH=src python scripts/build_fixtures.py && PYTHONPATH=src python scripts/export_schemas.py
      - run: git diff --exit-code -- fixtures schemas
      - run: PYTHONPATH=src ruff check . && PYTHONPATH=src ruff format --check . && PYTHONPATH=src mypy src && PYTHONPATH=src pytest
      - run: PYTHONPATH=src make package-check
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip && python -m pip install -e .
      - run: PYTHONPATH=src python scripts/build_fixtures.py && PYTHONPATH=src python -m ccm_casework.cli validate fixtures/safe-manifest.json
